[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casingrel"
version = "0.0.1"
description = "Deterministic and probabilistic casing design (API TR 5C3 / ISO/TR 10400)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.7", "pint>=0.23", "pyyaml>=6", "matplotlib>=3.8", "scipy>=1.11"]

[project.scripts]
casingrel = "casingrel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "openturns>=1.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
